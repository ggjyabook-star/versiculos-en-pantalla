<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Versículos en Pantalla</title>
<meta name="description" content="Presentación automática de versículos de la Biblia (Reina-Valera 1909) con fondos animados.">
<meta name="theme-color" content="#05060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marcellus&family=Figtree:wght@400;600&display=swap">
<style>
/* Pantalla de proyección: fondo animado a sangre, versículo centrado, controles que se esconden solos */
:root {
  --noche: #05060d;
  --papel: #fbf6ee;
  --oro: #f1d29a;
  --vidrio: rgba(12, 12, 24, .52);
  --linea: rgba(251, 246, 238, .16);
  --f-verso: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-cita: "Marcellus", "Trajan Pro", Georgia, serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--noche);
  color: var(--papel);
  font-family: var(--f-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body.quieto, body.quieto * { cursor: none; }

.fondo {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  opacity: 0;
  transition: opacity 2.4s ease;
}
.fondo.visible { opacity: 1; }

.velo {
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 50%, rgba(0,0,0,.34), rgba(0,0,0,0) 70%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
}

.escena {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.6em;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(96px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  transition: opacity .9s ease, transform .9s ease;
}
.escena.saliendo { opacity: 0; transform: translateY(-.6vh); }

.verso {
  margin: 0;
  max-width: min(88vw, 1500px);
  font-family: var(--f-verso);
  font-weight: 500;
  line-height: 1.22;
  letter-spacing: .005em;
  text-wrap: balance;
  text-shadow: 0 2px 28px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.35);
}
.verso .linea { display: block; }
.palabra {
  display: inline-block;
  opacity: 0;
  filter: blur(10px);
  transform: translateY(.25em);
  animation: aparece 1.3s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay: calc(var(--i) * 75ms + .25s);
}
@keyframes aparece { to { opacity: 1; filter: blur(0); transform: none; } }
.verso.quieto .palabra, .cita.quieto { animation: none; opacity: 1; filter: none; transform: none; }

.negro { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .8s ease; z-index: 3; }
.negro.activo { opacity: 1; }
.vacio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; font-size: clamp(16px, 2vw, 26px); color: rgba(251,246,238,.85); }
.vacio a { color: var(--oro); }

.cita {
  display: flex; align-items: center; gap: .9em;
  font-family: var(--f-cita);
  font-style: normal;
  font-size: clamp(16px, 2.3vw, 44px);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--oro);
  text-shadow: 0 2px 18px rgba(0,0,0,.6);
  opacity: 0;
  animation: aparece 1.4s ease forwards;
  animation-delay: var(--retraso, 1.5s);
}
.cita::before, .cita::after {
  content: ""; width: clamp(24px, 5vw, 90px); height: 1px;
  background: linear-gradient(90deg, transparent, var(--oro));
}
.cita::after { background: linear-gradient(90deg, var(--oro), transparent); }

.version {
  position: fixed;
  right: max(18px, env(safe-area-inset-right, 0px));
  top: max(14px, env(safe-area-inset-top, 0px));
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(251,246,238,.45);
}

.progreso {
  position: fixed; left: 0; right: 0; bottom: 0; height: 3px;
  background: rgba(255,255,255,.06);
}
.progreso span {
  display: block; height: 100%; width: 100%;
  transform-origin: left; transform: scaleX(0);
  background: linear-gradient(90deg, rgba(241,210,154,.2), var(--oro));
}

.controles {
  position: fixed; left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
  max-width: calc(100vw - 32px);
  padding: 8px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  background: var(--vidrio);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: opacity .5s ease, transform .5s ease;
}
body.quieto .controles { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.controles button, .controles select, .controles .boton-panel {
  text-decoration: none;
  font: 600 14px/1 var(--f-ui);
  color: var(--papel);
  background: transparent;
  border: 0; border-radius: 999px;
  height: 40px; min-width: 40px; padding: 0 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer;
}
.controles select { appearance: none; -webkit-appearance: none; padding: 0 14px; background: rgba(255,255,255,.06); }
.controles select option { color: #111; background: #fff; }
.controles button:hover, .controles select:hover, .controles .boton-panel:hover { background: rgba(255,255,255,.1); }
.controles button:focus-visible, .controles select:focus-visible, .controles .boton-panel:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.controles button[aria-pressed="true"] { background: rgba(241,210,154,.18); color: var(--oro); }
.controles svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.controles .lleno { fill: currentColor; stroke: none; }
.contador { font: 400 13px/1 var(--f-ui); font-variant-numeric: tabular-nums; color: rgba(251,246,238,.7); padding: 0 10px; }
.separa { width: 1px; height: 22px; background: var(--linea); }

.ayuda {
  position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  font-size: 13px; color: rgba(251,246,238,.75);
  background: var(--vidrio); border: 1px solid var(--linea); border-radius: 999px;
  padding: 8px 16px; white-space: nowrap;
  transition: opacity .8s ease;
}
.ayuda.fuera { opacity: 0; pointer-events: none; }
.ayuda kbd { font: 600 12px var(--f-ui); border: 1px solid var(--linea); border-radius: 5px; padding: 1px 6px; margin: 0 2px; }
@media (max-width: 640px) {
  .ayuda { display: none; }
  .contador, .separa { display: none; }
  .controles { flex-wrap: nowrap; gap: 2px; padding: 6px; }
  .controles button, .controles select { height: 38px; min-width: 38px; padding: 0 8px; }
  #btnAzar span, #btnPanel span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .palabra, .cita { animation: none; opacity: 1; filter: none; transform: none; }
  .escena { transition: opacity .6s ease; }
  .fondo { transition-duration: 1s; }
}
</style>
</head>
<body>
<canvas class="fondo" id="fondoA" aria-hidden="true"></canvas>
<canvas class="fondo" id="fondoB" aria-hidden="true"></canvas>
<div class="velo" aria-hidden="true"></div>

<main class="escena" id="escena" aria-live="polite">
  <blockquote class="verso" id="verso"></blockquote>
  <cite class="cita" id="cita"></cite>
</main>
<div class="vacio" id="vacio" hidden>
  <p>No hay versículos activos.</p>
  <a href="panel.html" target="vp-panel">Abrir el panel para agregar versículos</a>
</div>
<div class="negro" id="negro" aria-hidden="true"></div>

<div class="version">Reina-Valera 1909</div>
<div class="ayuda" id="ayuda"><kbd>F</kbd> pantalla completa · <kbd>Espacio</kbd> pausa · <kbd>←</kbd><kbd>→</kbd> cambiar · <kbd>B</kbd> negro</div>

<nav class="controles" id="controles" aria-label="Controles de la presentación">
  <button type="button" id="btnAnterior" aria-label="Versículo anterior" title="Anterior (←)">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button type="button" id="btnPausa" aria-label="Pausar" title="Pausa (Espacio)">
    <svg viewBox="0 0 24 24" id="icoPausa"><rect class="lleno" x="6" y="5" width="4" height="14" rx="1"/><rect class="lleno" x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <button type="button" id="btnSiguiente" aria-label="Siguiente versículo" title="Siguiente (→)">
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <span class="separa"></span>
  <label for="tiempo" class="contador" style="padding:0 4px 0 8px">Tiempo</label>
  <select id="tiempo" aria-label="Tiempo por versículo">
    <option value="auto">Según largo</option>
    <option value="10">10 s</option>
    <option value="15">15 s</option>
    <option value="20">20 s</option>
    <option value="30">30 s</option>
    <option value="60">1 min</option>
  </select>
  <button type="button" id="btnAzar" aria-pressed="false" title="Orden al azar (R)">
    <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    <span>Azar</span>
  </button>
  <button type="button" id="btnPantalla" aria-label="Pantalla completa" title="Pantalla completa (F)">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <a href="panel.html" target="vp-panel" id="btnPanel" class="boton-panel" title="Cambiar versículos y fondos">
    <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>Editar</span>
  </a>
  <span class="separa"></span>
  <span class="contador" id="contador">1 / 1</span>
</nav>

<div class="progreso" aria-hidden="true"><span id="barra"></span></div>

<script src="versiculos.js"></script>
<script src="fondos.js"></script>
<script src="comun.js"></script>
<script src="app.js"></script>
</body>
</html>
